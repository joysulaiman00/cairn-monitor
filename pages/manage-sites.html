<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Monitored Sites</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="/images/Cairn_Logo_337_X_100.webp" alt="Cairn University Logo" style="height: 48px; width: auto;">
        <div></div>
      </div>
      <div class="live-badge">
        <span class="live-dot"></span>
        MANAGE
      </div>
      <form action="/logout" method="POST">
        <button type="submit" class="logout-btn">Logout</button>
      </form>
    </div>
  </header>

  <main>
    <section class="cards-section">
      <div class="section-heading">
        <div>
          <h2 class="section-title">Manage Monitored Sites</h2>
          <p class="section-description">Add, remove, or update the URLs the monitor checks.</p>
        </div>
        <a href="/" class="secondary-btn">Back to Dashboard</a>
      </div>

      <div class="manage-panel">
        <p class="manage-note">This page will let you delete sites, modify URLs, and add new sites.</p>
        <div class="manage-placeholder">
          <strong>Coming soon:</strong> site management controls.
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span>Cairn University Technology Services &mdash; Internal Use Only</span>
    <span id="footer-clock"></span>
  </footer>
</body>
</html>
