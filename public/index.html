<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cairn University — Site Monitor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="/images/Cairn_Logo_337_X_100.webp" alt="Cairn University Logo" style="height: 48px; width: auto;">
        <div>
        </div>
      </div>
      <div class="header-actions">
        <a id="history-btn" href="/history" class="secondary-btn">History</a>
      </div>
      <div class="live-badge">
        <span class="live-dot"></span>
        LIVE
      </div>
      <form action="/logout" method="POST">
        <button type="submit" class="logout-btn">Logout</button>
      </form>
    </div>
  </header>

  <main>

    <!-- Summary bar -->
    <section class="summary-bar">
      <div class="summary-card">
        <span class="summary-value" id="stat-total">—</span>
        <span class="summary-label">Total Sites</span>
      </div>
      <div class="summary-card up">
        <span class="summary-value" id="stat-up">—</span>
        <span class="summary-label">Online</span>
      </div>
      <div class="summary-card down">
        <span class="summary-value" id="stat-down">—</span>
        <span class="summary-label">Offline</span>
      </div>
      <div class="summary-card">
        <span class="summary-value" id="stat-avg">—</span>
        <span class="summary-label">Avg Response</span>
      </div>
      <div class="summary-card">
        <span class="summary-value" id="stat-updated">—</span>
        <span class="summary-label">Last Updated</span>
      </div>
    </section>

    <!-- Status cards -->
    <section class="cards-section">
      <div class="section-heading">
        <h2 class="section-title">Site Status</h2>
        <a href="/manage-sites" class="secondary-btn">Manage Sites</a>
      </div>
      <div class="cards-grid" id="cards-grid">
        <!-- injected by app.js -->
      </div>
    </section>

    <!-- Detail table -->
    <section class="table-section">
      <h2 class="section-title">Details</h2>
      <div class="table-wrapper">
        <table id="results-table">
          <thead>
            <tr>
              <th>Site</th>
              <th>Category</th>
              <th>Status</th>
              <th>HTTP Code</th>
              <th>Response Time</th>
              <th>Last Checked</th>
            </tr>
          </thead>
          <tbody id="results-body">
            <!-- injected by app.js -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <footer>
    <span>Cairn University Technology Services &mdash; Internal Use Only</span>
    <span id="footer-clock"></span>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
