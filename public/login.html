<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cairn University — Site Monitor Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-brand">
        <img src="https://cairn.edu/wp-content/uploads/2022/05/Logo-A-100.png" alt="Cairn University Logo" style="width:337px;height:100px;">
        <div>
          <div class="login-brand-sub">Technology Services · Site Monitor</div>
        </div>
      </div>

      <h1 class="login-title">Sign in</h1>
      

      <div id="error-msg" class="error-banner" style="display:none"></div>

      <form method="POST" action="/login" class="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
            autofocus
          />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>
    <p class="login-desc">Authorized Technology Services staff only.</p>

    </div>
    <p class="login-footer">
      New to TS Monitor? <a href="/signup" class="auth-link">Create an account</a>
    </p>
    <p class="login-footer">Internal use only &mdash; Cairn University &copy; 2026</p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const err    = params.get("error");
    const banner = document.getElementById("error-msg");
    if (err === "invalid") {
      banner.textContent = "Incorrect username or password.";
      banner.style.display = "block";
    } else if (err === "missing") {
      banner.textContent = "Please enter your username and password.";
      banner.style.display = "block";
    } else if (err === "server") {
      banner.textContent = "A server error occurred. Please try again.";
      banner.style.display = "block";
    }
  </script>
</body>
</html>
